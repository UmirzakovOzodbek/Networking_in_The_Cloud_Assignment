services:
  app:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://cwms:cwms_password@db:5432/cwms
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cwms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cwms
      POSTGRES_PASSWORD: cwms_password
      POSTGRES_DB: cwms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cwms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cwms -d cwms"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - cwms-network
    restart: unless-stopped

networks:
  cwms-network:
    driver: bridge

volumes:
  postgres_data:
